# ─────────────────────────────────────────────────────────────────────────
# Telegram Mini App — stream masking
# Subscribers only ever fetch  /tv/<opaque-id>/index.m3u8  — the real channel
# name, the origin host, and the provider are never in a client URL.
#   * The `map` below is the ONLY place opaque-id -> channelN is resolved.
#   * Segments keep the same Cache-Control as /hls (via $hls_cache_control),
#     so the CDN still edge-caches .ts (origin offload).
#   * Rotate the ids in this map anytime to invalidate every leaked link.
#
# INSTALL: put this map in the http{} block, and the location{} in each
# server{} block (8080 and 443), then `docker restart nginx-rtmp`.
# ─────────────────────────────────────────────────────────────────────────

# --- goes in http { } (next to the other `map` directives) ---
map $tgid $tgch {
    default   "";
    a7x2k9    channel28;   # Apple TV+
    b3m8p1    channel29;   # Hulu
    c5q2w7    channel30;   # HBO
    d9r4t6    channel31;   # HBO Max
    e2n8y3    channel32;   # HBO Max 2
    f6k1v9    channel33;   # Paramount Network
    g4h7z2    channel34;   # Paramount+
    h8b3m5    channel35;   # Peacock
    j1d6q4    channel36;   # Cinemax
    k7f2x8    channel37;   # ESPN ACC
    m3p9c1    channel38;   # ESPN 2
    n5t4w6    channel39;   # ESPN U
    p2j8k3    channel40;   # beIN Sports
    q9v1h7    channel41;   # Fox Sports 1
    r4m6b2    channel42;   # NBC Sports Bay Area
    s8x3n5    channel43;   # NBC Golf
}

