# ─────────────────────────────────────────────────────────────
# Nginx-RTMP – Production HLS Streaming Server
# Ingest : rtmp://HOST:1935/live/<key>
# HLS    : http://HOST:8080/hls/<key>.m3u8
# Stats  : http://HOST:8080/stat
# ─────────────────────────────────────────────────────────────

worker_processes auto;
rtmp_auto_push on;
rtmp_auto_push_reconnect 1s;

error_log /dev/stderr warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

# ── RTMP block ────────────────────────────────────────────────
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        buflen 2s;

        # ── live application – RTMP ingest → HLS output ──────
        application live {
            live on;
            record off;

            # ── HLS output ───────────────────────────────────
            hls on;
            hls_path /var/www/hls;

            # 2-second segments → ~4–6 s end-to-end latency
            hls_fragment 2s;
            # Keep 5 segments in playlist (10 s window)
            hls_playlist_length 10s;

            # FFmpeg writes HLS directly; disable nginx-rtmp cleanup
            # so it doesn't delete directories between restarts.
            hls_cleanup off;

            # Continuous playlist – prevents gaps at reconnect
            hls_continuous on;

            # Nest channel files under /var/www/hls/<key>/
            hls_nested on;

            # Use millisecond-precision segment names
            hls_fragment_naming system;

            # ── Access control ───────────────────────────────
            # Allow ingest from any IP (tighten in production)
            allow publish all;
            allow play all;

            # ── Callbacks (optional notifications) ───────────
            # on_publish  http://localhost:8888/on_publish;
            # on_done     http://localhost:8888/on_done;
        }
    }
}

# ── HTTP block ────────────────────────────────────────────────
http {
    sendfile        off;   # must be off for HLS files
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    directio        512;

    types {
        application/vnd.apple.mpegurl  m3u8;
        video/mp2t                     ts;
        text/html                      html;
        application/json               json;
    }
    default_type application/octet-stream;

    # Cache-Control varies by file: live .m3u8 playlists must NEVER be cached
    # (the player needs the fresh segment list), but .ts segments are immutable
    # and short-lived, so mark them cacheable → a CDN (Bunny) offloads them.
    map $uri $hls_cache_control {
        default  "no-cache, no-store, must-revalidate";
        "~\.ts$" "public, max-age=60";
    }

    access_log /dev/stdout;

    # Gzip (not for media, only for text assets)
    gzip on;
    gzip_types text/plain application/json;

    server {
        listen 8080;
        server_name _;

        # ── Healthcheck ──────────────────────────────────────
        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ── HLS segments ─────────────────────────────────────
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t                    ts;
            }
            root /var/www;

            # No caching – live segments must be fresh
            add_header Cache-Control   $hls_cache_control;

            # CORS – allow any origin to load the stream
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Range";
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range";

            if ($request_method = OPTIONS) {
                return 204;
            }

            # Disable sendfile for HLS
            sendfile off;
        }

        # ── Browser test player ──────────────────────────────
        location /player {
            root /var/www;
            index index.html;
            add_header Access-Control-Allow-Origin "*";
            # Live app HTML — never let the browser serve a stale player.
            # `always` forces the header even on 304/static responses.
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma no-cache always;
            add_header Expires 0 always;
            etag off;
            if_modified_since off;
        }

        # ── RTMP statistics (XML) ────────────────────────────
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
            add_header Access-Control-Allow-Origin "*";
        }

        location /stat.xsl {
            root /usr/local/nginx/html;
        }

        # ── RTMP control endpoint ────────────────────────────
        location /control {
            rtmp_control all;
        }

        # Deny everything else
        location / {
            return 404;
        }
    }

    # ── HTTPS server (port 443) ──────────────────────────────────
    server {
        listen 443 ssl;
        server_name live3.mzolotv.com;

        ssl_certificate     /etc/letsencrypt/live/live3.mzolotv.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/live3.mzolotv.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t                    ts;
            }
            root /var/www;
            add_header Cache-Control   $hls_cache_control;
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Range";
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range";
            if ($request_method = OPTIONS) { return 204; }
            sendfile off;
        }

        location /player {
            root /var/www;
            index index.html;
            add_header Access-Control-Allow-Origin "*";
            # Live app HTML — never let the browser serve a stale player.
            # `always` forces the header even on 304/static responses.
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma no-cache always;
            add_header Expires 0 always;
            etag off;
            if_modified_since off;
        }

        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
            add_header Access-Control-Allow-Origin "*";
        }

        location / {
            return 404;
        }
    }
}
