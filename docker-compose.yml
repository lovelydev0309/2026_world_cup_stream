version: "3.9"

# ─────────────────────────────────────────────
# Streaming Stack – Nginx-RTMP + HLS
# Run:  docker compose up -d
# RTMP: rtmp://HOST:1935/live/<channel>
# HLS:  http://HOST:8080/hls/<channel>.m3u8
# Stat: http://HOST:8080/stat
# ─────────────────────────────────────────────

services:

  # ── Primary media server (Nginx-RTMP) ──────
  nginx-rtmp:
    build:
      context: ./nginx-rtmp
      dockerfile: Dockerfile
    container_name: nginx-rtmp
    restart: unless-stopped
    ports:
      - "1935:1935"   # RTMP ingest (OBS, FFmpeg)
      - "8080:8080"   # HTTP – HLS, player, stats
      - "80:8080"     # HTTP :80 origin (CDN pull hedge)
      - "443:443"     # HTTPS – HLS, player (TLS)
    volumes:
      - ./hls:/var/www/hls                         # HLS segments (host-accessible)
      - ./player:/var/www/player                   # Browser test players
      - ./vod-disk:/var/www/player/vod              # 200GB movie disk
      - ./nginx-rtmp/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro       # Let's Encrypt certs
    environment:
      - TZ=UTC
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Optional: SRS as drop-in alternative ───
  # Uncomment and comment out nginx-rtmp above to switch.
  #
  # srs:
  #   image: ossrs/srs:5
