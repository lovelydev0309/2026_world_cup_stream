  #   restart: unless-stopped
  #   ports:
  #     - "1935:1935"
  #     - "8080:8080"
  #     - "1985:1985"   # SRS HTTP API
  #   volumes:
  #     - ./srs/srs.conf:/usr/local/srs/conf/srs.conf:ro
  #     - ./hls:/usr/local/srs/objs/nginx/html/hls
  #     - ./player:/usr/local/srs/objs/nginx/html/player
