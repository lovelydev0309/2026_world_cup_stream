<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="DejaVu Sans, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1424"/>
      <stop offset="1" stop-color="#04060c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.80" cy="0.28" r="0.78">
      <stop offset="0" stop-color="#ff7a2e" stop-opacity="0.60"/>
      <stop offset="0.45" stop-color="#ff3d55" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20304f"/>
      <stop offset="1" stop-color="#0c1424"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- channel-strip motif (generic tiles, no third-party logos) -->
  <g opacity="0.45">
    <rect x="92"  y="520" width="118" height="46" rx="11" fill="#141d33"/>
    <rect x="226" y="520" width="118" height="46" rx="11" fill="#141d33"/>
    <rect x="360" y="520" width="118" height="46" rx="11" fill="#141d33"/>
    <rect x="494" y="520" width="118" height="46" rx="11" fill="#141d33"/>
    <rect x="628" y="520" width="118" height="46" rx="11" fill="#141d33"/>
  </g>

  <!-- Smart TV -->
  <g transform="translate(772,150)">
    <rect x="0" y="0" width="420" height="252" rx="20" fill="url(#scr)" stroke="#33436a" stroke-width="4"/>
    <rect x="16" y="16" width="388" height="220" rx="12" fill="#0b1424"/>
    <rect x="40" y="38" width="94" height="12" rx="6" fill="#33436a"/>
    <rect x="40"  y="66" width="104" height="86" rx="12" fill="#7c3aed"/>
    <rect x="156" y="66" width="104" height="86" rx="12" fill="#f59e0b"/>
    <rect x="272" y="66" width="104" height="86" rx="12" fill="#10b981"/>
    <rect x="40" y="168" width="336" height="10" rx="5" fill="#22304d"/>
    <rect x="40" y="188" width="228" height="10" rx="5" fill="#1a2740"/>
    <rect x="180" y="256" width="60" height="16" rx="4" fill="#33436a"/>
    <rect x="150" y="272" width="120" height="12" rx="6" fill="#22304d"/>
  </g>

  <!-- Wordmark + tagline -->
  <text x="92" y="238" font-size="104" font-weight="bold" fill="#ffffff">KOZEE<tspan fill="#ff7a2e"> TV</tspan></text>
  <text x="96" y="302" font-size="35" fill="#cdd8ec">Canales de EE.UU. en Vivo &#183; HD</text>

  <!-- EN VIVO badge -->
  <g transform="translate(96,342)">
    <rect x="0" y="0" width="200" height="54" rx="27" fill="#e0304a"/>
    <circle cx="35" cy="27" r="9" fill="#ffffff"/>
    <text x="56" y="36" font-size="26" font-weight="bold" fill="#ffffff">EN VIVO</text>
  </g>
  <text x="316" y="378" font-size="26" fill="#93a1b8">16 canales premium</text>
</svg>
