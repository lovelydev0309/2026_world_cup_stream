<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Channel Status</title>
<style>
  /* Single-theme by intent: this is a TV channel wall, read dark. Every colour is set
     explicitly so it never borrows a host background. */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --bg:#0d0d0d; --card:#1a1a1a; --card-dim:#151515; --line:#2a2a2a;
    --tx:#e0e0e0; --dim:#8a8a8a; --faint:#555;
    --live:#d00; --slate:#4a7fd0; --warn:#c8860a; --off:#6a6a6a;
  }
  body {
    background: var(--bg);
    color: var(--tx);
    font-family: "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    padding-block: 28px 56px;
    padding-inline: 16px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }

  header { display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 18px; margin-bottom:6px; }
  h1 { font-size: 1.4rem; letter-spacing: .06em; color: #fff; }
  .sub { font-size: .85rem; color: var(--dim); font-variant-numeric: tabular-nums; }
  .updated { font-size:.75rem; color: var(--faint); margin-bottom:26px; }

  /* country section */
  .country { margin-bottom: 30px; }
  .chead {
    display:flex; align-items:center; gap:10px;
    padding-bottom:7px; margin-bottom:14px; border-bottom:1px solid var(--line);
  }
  .chead h2 { font-size:1rem; font-weight:600; letter-spacing:.02em; color:#fff; }
  .count { font-size:.75rem; color:var(--dim); font-variant-numeric:tabular-nums; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--card);
    border-radius: 10px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: transform .15s, box-shadow .15s;
    border: 1px solid var(--line);
    display:flex; flex-direction:column;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .card:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  /* A channel that is not watchable right now is dimmed rather than hidden, so the
     lineup stays stable and the reason is visible on the card itself. */
  .card.down { background: var(--card-dim); }
  .card.down .thumb img { opacity:.4; filter:grayscale(1); }
  .card.down .info h2 { color: var(--dim); }

  .thumb {
    width: 100%;
    aspect-ratio: 16/9;
    background: #111;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.5rem;
    padding: 10%;
  }
  .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .info { padding: 13px 15px; display:flex; flex-direction:column; gap:7px; flex:1; }
  .info h2 { font-size: .93rem; line-height:1.3; }
  .badge {
    display: inline-block; align-self:flex-start;
    background: var(--live); color: #fff;
    font-size: .68rem; font-weight: 700;
    padding: 2px 8px; border-radius: 99px; letter-spacing: .05em;
  }
  .badge.SLATE   { background: var(--slate); }
  .badge.SLOW,
  .badge.STALLED { background: var(--warn); }
  .badge.OFF     { background: var(--off); }
  .empty { color:#888; }
  @media (max-width:430px){ .grid{ grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>&#9654; Live Channels</h1>
    <span class="sub" id="sub">loading…</span>
  </header>
  <div class="updated" id="updated"></div>
  <div id="out"><p class="empty">Loading channel list…</p></div>
</div>
<script>
(function () {
  var out = document.getElementById('out');
  // Display order; anything new is appended alphabetically so the page never hides a
  // country just because this list has not been updated.
  // Display order. Anything not listed still renders, appended alphabetically, so
  // re-listing a hidden country needs no change here.
  var ORDER = ['Mexico','US'];
  var FLAG  = {'Mexico':'🇲🇽','Peru':'🇵🇪',
               'US':'🇺🇸','El Salvador':'🇸🇻',
               'Guatemala':'🇬🇹','Honduras':'🇭🇳',
               'Colombia':'🇨🇴','Venezuela':'🇻🇪',
               'Cuba':'🇨🇺'};
  var LABEL = { 'US':'United States' };

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function card(ch){
    // channels.json carries live/state as of ~5s ago. Older copies of this page showed a
    // hardcoded LIVE badge on every channel, which told viewers a stalled channel was fine.
    var state = ch.state || 'LIVE';
    var down  = (ch.live === false);
    var label = down ? state : 'LIVE';
    return '<a class="card' + (down ? ' down' : '') + '" href="/player/' + esc(ch.name) + '.html">'
      + '<div class="thumb"><img src="' + esc(ch.logo) + '" alt="" loading="lazy"'
      + ' onerror="this.style.display=\'none\'"></div>'
      + '<div class="info"><h2>' + esc(ch.title) + '</h2>'
      + '<span class="badge ' + esc(down ? state : '') + '">' + esc(label) + '</span>'
      + '</div></a>';
  }

  function render(list){
    if (!Array.isArray(list) || !list.length) {
      out.innerHTML = '<p class="empty">No live channels.</p>'; return;
    }
    var by = {};
    list.forEach(function (ch) {
      var k = ch.country || 'Other';
      (by[k] = by[k] || []).push(ch);
    });
    var rest = Object.keys(by).filter(function (c) { return ORDER.indexOf(c) < 0; }).sort();
    var countries = ORDER.filter(function (c) { return by[c]; }).concat(rest);

    var live = list.filter(function (c) { return c.live !== false; }).length;
    document.getElementById('sub').textContent =
      list.length + ' channels across ' + countries.length + ' countries'
      + (live < list.length ? ' · ' + live + ' live now' : '');
    var d = new Date();
    document.getElementById('updated').textContent =
      'Updated ' + d.toLocaleTimeString() + ' · refreshes automatically';

    out.innerHTML = countries.map(function (c) {
      var items = by[c];
      var up = items.filter(function (x) { return x.live !== false; }).length;
      return '<section class="country">'
        + '<div class="chead"><h2>' + (FLAG[c] ? FLAG[c] + ' ' : '') + esc(LABEL[c] || c) + '</h2>'
        + '<span class="count">' + (up < items.length ? up + ' / ' + items.length + ' live'
                                                      : items.length + ' channels') + '</span>'
        + '</div><div class="grid">' + items.map(card).join('') + '</div></section>';
    }).join('');
  }

  function load(){
    fetch('/player/channels.json', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(render)
      .catch(function () {
        if (!out.querySelector('.country')) {
          out.innerHTML = '<p class="empty">Could not load channel list.</p>';
        }
      });
  }
  load();
  setInterval(load, 15000);   // channels.json itself refreshes every ~5s
})();
</script>
</body>
</html>
