<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Channels</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d0d;
    color: #e0e0e0;
    font-family: "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    padding: 32px 16px;
  }
  h1 { font-size: 1.4rem; letter-spacing: .06em; margin-bottom: 28px; color: #fff; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    max-width: 1000px;
  }
  .card {
    background: #1a1a1a;
    border-radius: 10px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: transform .15s, box-shadow .15s;
    border: 1px solid #2a2a2a;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .thumb {
    width: 100%;
    aspect-ratio: 16/9;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    padding: 10%;
  }
  .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .info { padding: 14px 16px; }
  .info h2 { font-size: .95rem; margin-bottom: 6px; }
  .badge {
    display: inline-block;
    background: #d00;
    color: #fff;
    font-size: .7rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 99px;
    letter-spacing: .04em;
  }
  .m3u8 { font-size: .72rem; color: #555; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<h1>&#9654; Live Channels</h1>
<div class="grid" id="grid"></div>
<script>
(function () {
  var grid = document.getElementById('grid');
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  fetch('/player/channels.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (list) {
      if (!Array.isArray(list) || !list.length) {
        grid.innerHTML = '<p style="color:#888">No live channels.</p>'; return; }
      grid.innerHTML = list.map(function (ch) {
        return '<a class="card" href="' + esc(ch.page) + '">'
          + '<div class="thumb"><img src="' + esc(ch.logo) + '" alt="" loading="lazy"'
          + ' onerror="this.style.display=\'none\'"></div>'
          + '<div class="info"><h2>' + esc(ch.title) + '</h2>'
          + '<span class="badge">LIVE</span>'
          + '<div class="m3u8">' + esc(ch.hls) + '</div></div></a>';
      }).join('');
    })
    .catch(function () {
      grid.innerHTML = '<p style="color:#888">Could not load channel list.</p>'; });
})();
</script>
</body>
</html>
