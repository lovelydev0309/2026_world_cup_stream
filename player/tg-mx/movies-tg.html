<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MAJO TV — Películas</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0b1220;color:#e6edf6;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  .top{position:sticky;top:0;z-index:5;background:rgba(11,18,32,.97);backdrop-filter:blur(6px);
    padding:10px 12px 8px;border-bottom:1px solid #1b2740}
  .top h1{font-size:16px;font-weight:800;margin-bottom:8px}
  .top h1 span{color:#38bdf8}
  .search{width:100%;border:1px solid #24324c;background:#0f1728;color:#e6edf6;
    border-radius:10px;padding:9px 12px;font-size:14px;outline:none}
  .search::placeholder{color:#6b7a92}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 2px;-webkit-overflow-scrolling:touch}
  .chip{flex:none;font-size:12px;padding:5px 11px;border-radius:14px;background:#14203a;
    border:1px solid #24324c;color:#b9c6db;cursor:pointer;white-space:nowrap}
  .chip.on{background:#0284c7;border-color:#0284c7;color:#fff;font-weight:700}
  .count{padding:6px 14px 2px;font-size:11px;color:#6b7a92}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:8px 12px 40px}
  @media(min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
  @media(min-width:760px){.grid{grid-template-columns:repeat(6,1fr)}}
  .card{position:relative;border-radius:11px;overflow:hidden;background:#111a2c;
    border:1px solid #1b2740;cursor:pointer;aspect-ratio:2/3}
  .card img{width:100%;height:100%;object-fit:cover;display:block;background:#0b1220}
  .card .meta{position:absolute;left:0;right:0;bottom:0;padding:16px 7px 6px;
    background:linear-gradient(transparent,rgba(4,7,14,.92));font-size:11px;line-height:1.25}
  .card .t{font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .sub{color:#9fb0c8;font-size:10px;margin-top:2px}
  .card .rt{position:absolute;top:6px;right:6px;background:rgba(2,8,20,.82);color:#ffcf5c;
    font-size:10px;font-weight:800;padding:2px 6px;border-radius:8px}
  .card .pl{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;
    justify-content:center;opacity:0;transition:opacity .15s}
  .card:active .pl{opacity:1}
  .card .pl span{background:rgba(2,132,199,.92);color:#fff;border-radius:50%;width:44px;height:44px;
    display:flex;align-items:center;justify-content:center;font-size:20px}
  .empty{padding:40px 20px;text-align:center;color:#6b7a92;font-size:13px}
</style>
</head>
<body>
  <div class="top">
    <h1>🎬 MAJO <span>Películas</span></h1>
    <input id="q" class="search" type="text" placeholder="Buscar películas…" autocomplete="off">
    <div class="chips" id="chips"></div>
  </div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">Aún no hay películas.</div>

<script>
(function(){
  var TG = window.Telegram && window.Telegram.WebApp;
  if (TG){ try{TG.ready();TG.expand();}catch(e){} }

  var BASE = "https://stream.tv247on.com";
  var CAT  = BASE + "/player/tg-mx/movies-tg.json";   // catalog of films actually ON Telegram
  var BOT  = "majotvwatch_bot";                        // deep-link target for native playback

  var grid=document.getElementById('grid'), countEl=document.getElementById('count'),
      emptyEl=document.getElementById('empty'), chipsEl=document.getElementById('chips'),
      q=document.getElementById('q');
  var MOVIES=[], genres=[], curGenre="Todas";

  function esc(s){return (s==null?'':String(s)).replace(/[<>&"]/g,function(c){
    return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];});}

  fetch(CAT + "?_=" + Date.now()).then(function(r){return r.json();}).then(function(d){
    MOVIES = (d||[]).filter(function(m){return m && m.message_id;});
    MOVIES.sort(function(a,b){return (b.rating||0)-(a.rating||0);});
    var gset={};
    MOVIES.forEach(function(m){ (m.genre||'').split(',').forEach(function(g){
      g=g.trim(); if(g) gset[g]=(gset[g]||0)+1; }); });
    genres = Object.keys(gset).sort(function(a,b){return gset[b]-gset[a];}).slice(0,12);
    renderChips(); render();
  }).catch(function(e){ countEl.textContent='No se pudo cargar el catálogo.'; });

  function play(m){
    // sendData works only from a reply-keyboard-launched Mini App; it hands {mv:id}
    // to the bot (which delivers the film natively) and closes the Mini App.
    if (TG && TG.sendData){ TG.sendData(JSON.stringify({mv: m.message_id})); }
    else { location.href = "https://t.me/" + BOT + "?start=mv_" + m.message_id; }
  }

  function renderChips(){
    var all=['Todas'].concat(genres);
    chipsEl.innerHTML = all.map(function(g){
      return '<div class="chip'+(g===curGenre?' on':'')+'" data-g="'+esc(g)+'">'+esc(g)+'</div>';
    }).join('');
    Array.prototype.forEach.call(chipsEl.children,function(c){
      c.onclick=function(){ curGenre=c.getAttribute('data-g');
        Array.prototype.forEach.call(chipsEl.children,function(x){x.classList.toggle('on',x===c);});
        render(); };
    });
  }

  function render(){
    var term=(q.value||'').trim().toLowerCase();
    var list=MOVIES.filter(function(m){
      if(curGenre!=='Todas' && (m.genre||'').indexOf(curGenre)<0) return false;
      if(term){ var hay=((m.title||'')+' '+(m.genre||'')).toLowerCase();
        if(hay.indexOf(term)<0) return false; }
      return true;
    });
    countEl.textContent = list.length+' película'+(list.length===1?'':'s')+' en Telegram';
    emptyEl.style.display = list.length? 'none':'block';
    grid.innerHTML = list.map(function(m,i){
      var poster = BASE+'/player/vod/'+m.slug+'/poster.jpg';
      var rt = (m.rating!=null && m.rating!=='')? '<div class="rt">★ '+m.rating+'</div>':'';
      return '<div class="card" data-i="'+i+'">'+
        '<img loading="lazy" src="'+esc(poster)+'" onerror="this.style.opacity=0.15">'+rt+
        '<div class="pl"><span>▶</span></div>'+
        '<div class="meta"><div class="t">'+esc(m.title||m.slug)+'</div>'+
        '<div class="sub">'+esc([m.year,m.duration].filter(Boolean).join(' · '))+'</div></div></div>';
    }).join('');
    Array.prototype.forEach.call(grid.children,function(c){
      c.onclick=function(){ play(list[parseInt(c.getAttribute('data-i'),10)]); };
    });
  }
  var deb; q.addEventListener('input',function(){clearTimeout(deb);deb=setTimeout(render,180);});
})();
</script>
</body>
</html>
