<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Channel Health — live3</title>
<style>
  :root{ --bg:#0d1117; --card:#161b22; --line:#30363d; --tx:#e6edf3; --dim:#8b949e;
         --ok:#2ea043; --warn:#d29922; --bad:#da3633; }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--tx);
    font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;
    align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5}
  h1{font-size:18px;margin:0;font-weight:600}
  .summary{font-size:13px;color:var(--dim)}
  .pill{padding:2px 10px;border-radius:20px;font-weight:600;font-size:12px}
  .pill.ok{background:rgba(46,160,67,.15);color:var(--ok)}
  .pill.bad{background:rgba(218,54,51,.15);color:var(--bad)}
  .pill.warn{background:rgba(210,153,34,.15);color:var(--warn)}
  main{padding:20px}
  .country{margin:0 0 26px}
  .chead{display:flex;align-items:center;gap:10px;margin:0 0 10px;
    padding-bottom:6px;border-bottom:1px solid var(--line)}
  .chead h2{font-size:15px;margin:0;font-weight:600}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .ch{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--dim);
    border-radius:10px;padding:12px 14px}
  .ch.OK{border-left-color:var(--ok)}
  .ch.SILENT,.ch.NO_AUDIO{border-left-color:var(--warn)}
  .ch.DOWN,.ch.NO_VIDEO,.ch.STALE,.ch.ENDED,.ch.DEGRADED{border-left-color:var(--bad)}
  .ch .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .ch .name{font-weight:600}
  .ch .num{color:var(--dim);font-size:12px}
  .st{font-size:12px;font-weight:700;letter-spacing:.03em;margin:6px 0 2px}
  .st.OK{color:var(--ok)} .st.SILENT,.st.NO_AUDIO{color:var(--warn)}
  .st.DOWN,.st.NO_VIDEO,.st.STALE,.st.ENDED,.st.DEGRADED{color:var(--bad)}
  .detail{color:var(--dim);font-size:12px}
  footer{padding:14px 22px;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
  .stale-warn{color:var(--warn)}
  @media(max-width:480px){ main{padding:14px} header{padding:14px} }
</style>
</head>
<body>
  <header>
    <h1>📺 Channel Health</h1>
    <span id="pill" class="pill">…</span>
    <span class="summary" id="updated">loading…</span>
  </header>
  <main id="out"></main>
  <footer>
    Synthetic viewer monitor — each channel is fetched through the CDN and its video+audio
    decoded, exactly as a viewer receives it. Monitor runs every 5 min (a full pass over 77 channels takes ~4.5 min); this page auto-refreshes every 30s.
  </footer>
<script>
  var OUT = document.getElementById('out');
  // Country order matches the landing page; anything unknown is appended alphabetically.
  var ORDER = ['Mexico','Peru','US','El Salvador','Venezuela','Colombia','Guatemala','Honduras','Cuba'];
  var FLAG  = {'Mexico':'🇲🇽','Peru':'🇵🇪','US':'🇺🇸','El Salvador':'🇸🇻','Venezuela':'🇻🇪',
               'Colombia':'🇨🇴','Guatemala':'🇬🇹','Honduras':'🇭🇳','Cuba':'🇨🇺'};
  var LABEL = {'US':'United States'};
  function esc(s){ return (s||'').replace(/[&<>]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

  function card(c){
    var meanTxt = (c.mean===null||c.mean===undefined) ? '' : (Math.round(c.mean)+' dB');
    var bits = [c.video, c.sr ? c.sr+' Hz' : '', meanTxt].filter(Boolean).join(' · ');
    return '<div class="ch '+esc(c.status)+'">'
      + '<div class="top"><span class="name">'+esc(c.name)+'</span>'
      + '<span class="num">ch'+c.ch+'</span></div>'
      + '<div class="st '+esc(c.status)+'">'+esc(c.status)+'</div>'
      + '<div class="detail">'+esc(c.detail)+'</div>'
      + (bits ? '<div class="detail">'+esc(bits)+'</div>' : '')
      + '</div>';
  }

  async function tick(){
    try{
      // status.json carries health; channels.json carries country. Join on channel number so
      // the monitor does not have to change when the lineup grows.
      var res = await Promise.all([
        fetch('status.json?_='+Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }),
        fetch('channels.json?_='+Date.now(), {cache:'no-store'})
          .then(function(r){ return r.json(); }).catch(function(){ return []; })
      ]);
      var d = res[0], lineup = res[1] || [];
      var countryOf = {};
      lineup.forEach(function(x){
        var n = parseInt(String(x.name||'').replace(/\D/g,''),10);
        if(n) countryOf[n] = x.country || '';
      });

      var pill = document.getElementById('pill');
      pill.textContent = d.ok + ' / ' + d.total + ' healthy';
      pill.className = 'pill ' + (d.ok === d.total ? 'ok' : 'bad');
      var age = Math.round((Date.now() - new Date(d.updated).getTime())/1000);
      // A full run over 77 channels measures ~273s and the cron is */5, so a healthy
      // dashboard is routinely 5-9 min old. Warn only past two missed cycles.
      document.getElementById('updated').innerHTML = 'updated ' + esc(d.updated) +
        (age > 900 ? ' <span class="stale-warn">(monitor may be stalled — '+age+'s ago)</span>'
                   : ' ('+age+'s ago)');

      var by = {};
      d.channels.forEach(function(c){
        var k = countryOf[c.ch] || 'Other';
        (by[k] = by[k] || []).push(c);
      });
      var rest = Object.keys(by).filter(function(k){ return ORDER.indexOf(k) < 0; }).sort();
      var order = ORDER.filter(function(k){ return by[k]; }).concat(rest);

      OUT.innerHTML = order.map(function(k){
        var list = by[k].sort(function(a,b){ return a.ch - b.ch; });
        var ok = list.filter(function(c){ return c.status === 'OK'; }).length;
        var cls = ok === list.length ? 'ok' : (ok === 0 ? 'bad' : 'warn');
        return '<section class="country">'
          + '<div class="chead">'
          + '<h2>' + (FLAG[k] ? FLAG[k]+' ' : '') + esc(LABEL[k] || k) + '</h2>'
          + '<span class="pill '+cls+'">'+ok+' / '+list.length+'</span>'
          + '</div><div class="grid">' + list.map(card).join('') + '</div></section>';
      }).join('');
    }catch(e){
      document.getElementById('updated').innerHTML =
        '<span class="stale-warn">status.json unavailable — monitor not yet run?</span>';
    }
  }
  tick(); setInterval(tick, 30000);
</script>
</body>
</html>
